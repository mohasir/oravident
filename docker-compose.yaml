version: '3.8'

services:
  database:
    image: postgres:15-alpine
    container_name: dentalsass_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: dentalsass
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
